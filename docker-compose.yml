version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: fitness-telegram-bot
    restart: unless-stopped
    environment:
      - TOKEN=${BOT_TOKEN}
      - API_KEY=${API_KEY}
    env_file:
      - .env
    volumes:
      - ./data:/app/data  
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"